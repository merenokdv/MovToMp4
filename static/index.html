<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MovToMp4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grain"></div>
  </div>

  <main class="shell">
    <header class="brand">
      <p class="mark">MovToMp4</p>
      <h1>Кинь <span>.mov</span> — забери <span>.mp4</span></h1>
      <p class="lead">Быстрая локальная конвертация через ffmpeg. Файлы никуда не уходят.</p>
    </header>

    <section
      class="drop"
      id="dropzone"
      tabindex="0"
      role="button"
      aria-label="Выбрать MOV файл"
    >
      <div class="drop-ring" aria-hidden="true"></div>
      <div class="drop-inner">
        <svg class="icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="6" y="10" width="36" height="28" rx="6" stroke="currentColor" stroke-width="2"/>
          <path d="M18 28l5.5-6.5L28 26l3.5-4.5L36 28H18z" fill="currentColor" opacity=".85"/>
          <circle cx="16" cy="18" r="2.5" fill="currentColor"/>
        </svg>
        <p class="drop-title">Перетащи MOV сюда</p>
        <p class="drop-hint">или нажми, чтобы выбрать файл</p>
      </div>
      <input id="file" type="file" accept=".mov,video/quicktime" hidden />
    </section>

    <section class="controls">
      <label class="field">
        <span>Режим</span>
        <select id="mode">
          <option value="copy" selected>Мгновенно (без перекодирования)</option>
          <option value="fast">Быстро (VideoToolbox)</option>
          <option value="quality">Качество (x264)</option>
        </select>
      </label>
      <p class="status" id="status">Готов к работе</p>
    </section>

    <section class="queue" id="queue" hidden></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
